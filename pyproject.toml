[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-quant-research"
version = "0.2.0"
description = "Leakage-safe cross-sectional equity research framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
research = ["matplotlib>=3.7", "pyarrow>=12", "xgboost>=2", "lightgbm>=4"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["quant_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
